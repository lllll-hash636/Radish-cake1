<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>科技與生活互動遊戲：齊來製作蘿蔔糕</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffeb3b;
      --accent-color: #00e676;
      --accent-text: #000000;
      --border-color: #ffeb3b;
      --beat-active: #ff4081;
      --danger-color: #ff5252;
    }

    body.soft-theme {
      --bg-color: #fff8e1;
      --card-bg: #ffffff;
      --text-color: #212121;
      --accent-color: #2e7d32;
      --accent-text: #ffffff;
      --border-color: #4e342e;
      --beat-active: #d81b60;
      --danger-color: #c62828;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      font-family: "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", Arial, sans-serif;
      background-color: #121212;
      background-color: var(--bg-color);
      color: #ffeb3b;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      border-bottom: 4px solid var(--border-color);
      background-color: var(--card-bg);
      flex-wrap: wrap;
      gap: 10px;
    }

    .header-title {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tool-btn {
      font-size: 1.15rem;
      font-weight: bold;
      padding: 10px 16px;
      border: 3px solid var(--border-color);
      border-radius: 12px;
      background-color: var(--bg-color);
      color: var(--text-color);
      cursor: pointer;
    }

    .tool-btn:focus {
      outline: 5px solid var(--beat-active);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      max-width: 1050px;
      width: 100%;
      margin: 0 auto;
    }

    .progress-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
      width: 100%;
    }

    .step-dot {
      flex: 1;
      max-width: 130px;
      height: 22px;
      border-radius: 12px;
      border: 3px solid var(--border-color);
      background-color: transparent;
    }

    .step-dot.active {
      background-color: var(--accent-color);
      transform: scale(1.08);
    }

    .step-dot.done {
      background-color: var(--border-color);
    }

    .stage-card {
      width: 100%;
      background-color: #1e1e1e;
      background-color: var(--card-bg);
      border: 5px solid #ffeb3b;
      border-color: var(--border-color);
      border-radius: 24px;
      padding: 26px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .step-badge {
      display: inline-block;
      font-size: 1.4rem;
      font-weight: 900;
      padding: 6px 22px;
      border-radius: 50px;
      border: 3px solid var(--border-color);
      margin-bottom: 10px;
    }

    h1 {
      font-size: 2.5rem;
      margin: 8px 0;
      line-height: 1.3;
    }

    .instruction-text {
      font-size: 1.75rem;
      font-weight: bold;
      margin: 12px 0 18px;
      line-height: 1.5;
    }

    .visual-stage {
      font-size: 6rem;
      margin: 10px 0;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: transform 0.15s ease;
    }

    .visual-stage.bounce {
      transform: scale(1.22) rotate(-5deg);
    }

    .ingredients-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      margin: 18px 0;
    }

    @media (max-width: 650px) {
      .ingredients-grid {
        grid-template-columns: 1fr;
      }
      h1 { font-size: 1.9rem; }
      .instruction-text { font-size: 1.35rem; }
    }

    .ingredient-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-size: 1.75rem;
      font-weight: 900;
      border: 5px solid var(--border-color);
      border-radius: 20px;
      background-color: var(--bg-color);
      color: var(--text-color);
      cursor: pointer;
      line-height: 1.35;
    }

    .ingredient-btn .emoji {
      font-size: 3.8rem;
      margin-bottom: 8px;
    }

    .ingredient-btn .sub-label {
      font-size: 1.35rem;
      font-weight: normal;
      opacity: 0.95;
      margin-top: 4px;
    }

    .ingredient-btn.selected {
      background-color: var(--accent-color);
      color: var(--accent-text);
      border-color: var(--accent-color);
    }

    .ingredient-btn:focus {
      outline: 6px solid var(--beat-active);
    }

    .big-action-btn {
      width: 100%;
      max-width: 620px;
      min-height: 125px;
      font-size: 2.25rem;
      font-weight: 900;
      padding: 22px 30px;
      border-radius: 28px;
      border: 6px solid #ffeb3b;
      border-color: var(--border-color);
      background-color: #00e676;
      background-color: var(--accent-color);
      color: #000000;
      color: var(--accent-text);
      cursor: pointer;
      margin: 16px auto 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      box-shadow: 0 8px 0 var(--border-color);
    }

    .big-action-btn:active, .big-action-btn.pressed {
      transform: translateY(6px);
      box-shadow: 0 2px 0 var(--border-color);
    }

    .big-action-btn:focus {
      outline: 6px solid var(--beat-active);
    }

    .count-display {
      font-size: 1.9rem;
      font-weight: 900;
      margin: 10px 0;
      letter-spacing: 2px;
    }

    .rhythm-meter {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin: 12px 0 18px;
    }

    .beat-circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 4px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 900;
      background-color: transparent;
    }

    .beat-circle.pulse {
      background-color: var(--beat-active);
      color: #ffffff;
      border-color: var(--beat-active);
      transform: scale(1.22);
    }

    .safety-box {
      border: 4px dashed var(--danger-color);
      border-radius: 16px;
      padding: 14px 20px;
      margin: 14px auto;
      max-width: 740px;
      font-size: 1.45rem;
      font-weight: bold;
      color: var(--danger-color);
      line-height: 1.45;
    }

    .summary-list {
      text-align: left;
      max-width: 740px;
      margin: 15px auto 25px;
      font-size: 1.45rem;
      line-height: 1.7;
      font-weight: bold;
      padding-left: 24px;
    }

    footer {
      text-align: center;
      padding: 12px;
      font-size: 1.15rem;
      opacity: 0.95;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">🥕 科技與生活：製作蘿蔔糕</div>
    <div class="toolbar" role="toolbar" aria-label="教師輔助設定">
      <button type="button" class="tool-btn" id="btnRepeatSpeech">🔊 重聽指令</button>
      <button type="button" class="tool-btn" id="btnToggleBeat">🎵 節拍器：開</button>
      <button type="button" class="tool-btn" id="btnToggleTheme">👁️ 高對比模式</button>
      <button type="button" class="tool-btn" id="btnReset">🔄 重新開始</button>
    </div>
  </header>

  <main>
    <div class="progress-bar" id="progressBar" aria-hidden="true">
      <div class="step-dot active"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
    </div>

    <!-- 預設直接寫入初始畫面，確保絕不黑屏 -->
    <section class="stage-card" id="stageContainer" aria-live="polite">
      <div class="step-badge">科技與生活 × 音樂節奏</div>
      <h1>齊來製作蘿蔔糕</h1>
      <div class="visual-stage">🥕 🦐 🍲 🎶</div>
      <p class="instruction-text">跟住音樂拍子，完成五個步驟整出香噴噴蘿蔔糕！</p>
      <button type="button" class="big-action-btn" id="primaryActionBtn" onclick="startGame()">
        ▶️ 開始製作
      </button>
    </section>
  </main>

  <footer>
    💡 操作提示：可點擊螢幕大按鈕，或直接按鍵盤「空白鍵 (Space)」／外接拍拍掣進行操作
  </footer>

  <script>
    (function() {
      /**
       * 安全音效引擎 (內建 try-catch 防止舊瀏覽器報錯)
       */
      var sound = {
        ctx: null,
        beatEnabled: true,
        beatTimer: null,
        beatStep: 0,

        init: function() {
          try {
            if (!this.ctx) {
              var AudioContext = window.AudioContext || window.webkitAudioContext;
              if (AudioContext) {
                this.ctx = new AudioContext();
              }
            }
            if (this.ctx && this.ctx.state === 'suspended') {
              this.ctx.resume();
            }
          } catch (e) {}
        },

        playTone: function(freq, duration, type, volume) {
          try {
            this.init();
            if (!this.ctx) return;
            var osc = this.ctx.createOscillator();
            var gain = this.ctx.createGain();
            osc.type = type || 'sine';
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(volume || 0.3, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + (duration || 0.2));
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + (duration || 0.2));
          } catch (e) {}
        },

        playMetronomeTick: function(isStrong) {
          if (!this.beatEnabled) return;
          this.playTone(isStrong ? 880 : 587.33, 0.12, 'triangle', isStrong ? 0.35 : 0.2);
        },

        playActionFeedback: function(stepIndex) {
          var scale = [523.25, 587.33, 659.25, 783.99, 880.00];
          this.playTone(scale[stepIndex % scale.length], 0.25, 'sine', 0.4);
        },

        playStepSuccess: function() {
          var self = this;
          var notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach(function(n, idx) {
            setTimeout(function() { self.playTone(n, 0.25, 'triangle', 0.35); }, idx * 120);
          });
        },

        playCelebrationSong: function() {
          var self = this;
          var melody = [
            { f: 659.25, d: 0.2, t: 0 },
            { f: 659.25, d: 0.2, t: 220 },
            { f: 783.99, d: 0.35, t: 440 },
            { f: 659.25, d: 0.2, t: 820 },
            { f: 587.33, d: 0.2, t: 1040 },
            { f: 523.25, d: 0.45, t: 1260 },
            { f: 587.33, d: 0.2, t: 1750 },
            { f: 659.25, d: 0.2, t: 1970 },
            { f: 783.99, d: 0.5, t: 2190 }
          ];
          melody.forEach(function(note) {
            setTimeout(function() { self.playTone(note.f, note.d, 'triangle', 0.4); }, note.t);
          });
        },

        startRhythmLoop: function(onBeatCallback) {
          var self = this;
          this.stopRhythmLoop();
          this.beatStep = 0;
          var triggerBeat = function() {
            var currentBeat = self.beatStep % 4;
            self.playMetronomeTick(currentBeat === 0);
            if (onBeatCallback) onBeatCallback(currentBeat);
            self.beatStep++;
          };
          triggerBeat();
          this.beatTimer = setInterval(triggerBeat, 750);
        },

        stopRhythmLoop: function() {
          if (this.beatTimer) {
            clearInterval(this.beatTimer);
            this.beatTimer = null;
          }
        }
      };

      /**
       * 安全粵語語音系統
       */
      var voice = {
        lastInstruction: "歡迎來到科技與生活音樂廚房！今日我哋一齊跟住音樂節拍，學整傳統美味嘅蘿蔔糕。請按「開始製作」按鈕。",

        speak: function(text, saveAsInstruction) {
          if (saveAsInstruction) {
            this.lastInstruction = text;
          }
          try {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            var utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-HK';
            utterance.rate = 0.9;
            utterance.pitch = 1.05;
            var voices = window.speechSynthesis.getVoices();
            for (var i = 0; i < voices.length; i++) {
              if (voices[i].lang.indexOf('zh-HK') !== -1 || voices[i].lang.indexOf('yue') !== -1) {
                utterance.voice = voices[i];
                break;
              }
            }
            window.speechSynthesis.speak(utterance);
          } catch (e) {}
        },

        repeat: function() {
          if (this.lastInstruction) {
            this.speak(this.lastInstruction, false);
          }
        }
      };

      var gameState = {
        step: 0,
        subPhase: 'select',
        selected: [],
        actionCount: 0,
        targetActions: 4
      };

      var ingredientsList = [
        { id: 'radish', name: '白蘿蔔', sub: '去皮切條／切絲', emoji: '🥕', speech: '白蘿蔔，去皮切條' },
        { id: 'sausage_shrimp', name: '臘腸、蝦米', sub: '切粒備用', emoji: '🦐', speech: '臘腸同蝦米，切粒備用' },
        { id: 'flours', name: '粘米粉、粟粉 30g', sub: '製作糕身粉漿', emoji: '🌾', speech: '粘米粉，加 30 克粟粉' },
        { id: 'seasoning_water', name: '水及調味料', sub: '鹽、糖、胡椒粉', emoji: '🧂', speech: '水，加鹽、糖、胡椒粉' }
      ];

      var stageContainer = document.getElementById('stageContainer');
      var progressDots = document.querySelectorAll('.step-dot');

      function updateProgressBar() {
        for (var i = 0; i < progressDots.length; i++) {
          progressDots[i].classList.remove('active', 'done');
          if (i + 1 < gameState.step) {
            progressDots[i].classList.add('done');
          } else if (i + 1 === gameState.step) {
            progressDots[i].classList.add('active');
          }
        }
      }

      function focusPrimaryButton() {
        var btn = document.getElementById('primaryActionBtn');
        if (btn) {
          try { btn.focus({ preventScroll: true }); } catch (e) { btn.focus(); }
        }
      }

      window.startGame = function() {
        sound.init();
        sound.playStepSuccess();
        gameState.step = 1;
        gameState.subPhase = 'select';
        gameState.selected = [];
        gameState.actionCount = 0;
        renderStage();
      };

      function renderStage() {
        sound.stopRhythmLoop();
        updateProgressBar();

        if (gameState.step === 0) renderWelcome();
        else if (gameState.step === 1) renderStep1PrepAndBatter();
        else if (gameState.step === 2) renderStep2SauteToppings();
        else if (gameState.step === 3) renderStep3CookRadish();
        else if (gameState.step === 4) renderStep4MixBatterIntoPot();
        else if (gameState.step === 5) renderStep5SteamAndCool();
        else if (gameState.step === 6) renderCompletion();
      }

      function renderWelcome() {
        var msg = "歡迎來到科技與生活音樂廚房！今日我哋一齊跟住音樂節拍，學整傳統美味嘅蘿蔔糕。請按「開始製作」按鈕。";
        stageContainer.innerHTML =
          '<div class="step-badge">科技與生活 × 音樂節奏</div>' +
          '<h1>齊來製作蘿蔔糕</h1>' +
          '<div class="visual-stage">🥕 🦐 🍲 🎶</div>' +
          '<p class="instruction-text">跟住音樂拍子，完成五個步驟整出香噴噴蘿蔔糕！</p>' +
          '<button type="button" class="big-action-btn" id="primaryActionBtn" onclick="startGame()">▶️ 開始製作</button>';
        voice.speak(msg, true);
        focusPrimaryButton();
      }

      function renderStep1PrepAndBatter() {
        if (gameState.subPhase === 'select') {
          var msg = "第一步：備料調漿。白蘿蔔去皮切條；臘腸、蝦米切粒；仲要準備粘米粉、粟粉 30 克、水同鹽、糖、胡椒粉。請點選四組材料，或者按空白鍵逐一選取。";
          var gridHtml = '';
          for (var i = 0; i < ingredientsList.length; i++) {
            var item = ingredientsList[i];
            var isSelected = gameState.selected.indexOf(item.id) !== -1;
            gridHtml +=
              '<button type="button" class="ingredient-btn ' + (isSelected ? 'selected' : '') + '" data-id="' + item.id + '">' +
                '<span class="emoji">' + item.emoji + '</span>' +
                '<span>' + item.name + (isSelected ? ' ✅' : '') + '</span>' +
                '<span class="sub-label">' + item.sub + '</span>' +
              '</button>';
          }

          var allSelected = gameState.selected.length === ingredientsList.length;
          stageContainer.innerHTML =
            '<div class="step-badge">第一步（共五步）：備料調漿</div>' +
            '<h1>認識材料及處理</h1>' +
            '<p class="instruction-text">請點選齊全 4 組材料（已選 ' + gameState.selected.length + ' / 4）：</p>' +
            '<div class="ingredients-grid">' + gridHtml + '</div>' +
            (allSelected ? '<button type="button" class="big-action-btn" id="primaryActionBtn">🥣 材料齊全！開始調粉漿</button>' : '');

          if (gameState.selected.length === 0) {
            voice.speak(msg, true);
          }

          var btns = document.querySelectorAll('.ingredient-btn');
          for (var j = 0; j < btns.length; j++) {
            btns[j].onclick = function() {
              var id = this.getAttribute('data-id');
              var found = null;
              for (var k = 0; k < ingredientsList.length; k++) {
                if (ingredientsList[k].id === id) found = ingredientsList[k];
              }
              if (!found) return;
              if (gameState.selected.indexOf(id) === -1) {
                gameState.selected.push(id);
                sound.playActionFeedback(gameState.selected.length - 1);
                if (gameState.selected.length === ingredientsList.length) {
                  voice.speak(found.speech + '。材料齊全啦！請按「開始調粉漿」。', true);
                } else {
                  voice.speak(found.speech, false);
                }
                renderStep1PrepAndBatter();
                if (gameState.selected.length === ingredientsList.length) {
                  focusPrimaryButton();
                }
              } else {
                voice.speak('已經選咗' + found.name, false);
              }
            };
          }

          var nextBtn = document.getElementById('primaryActionBtn');
          if (nextBtn) {
            nextBtn.onclick = function() {
              sound.playStepSuccess();
              gameState.subPhase = 'mix_batter';
              gameState.actionCount = 0;
              renderStep1PrepAndBatter();
            };
          }
        } else {
          renderRhythmStep({
            badge: "第一步（共五步）：備料調漿",
            title: "拌勻成無顆粒粉漿",
            instruction: "將粘米粉、粟粉 30g、水及鹽、糖、胡椒粉，跟住拍子攪勻 4 下！",
            safety: "💡 烹飪小貼士：一定要攪到無顆粒，蒸出嚟嘅蘿蔔糕先會滑溜。",
            emojiBefore: "🌾💧",
            emojiAfter: "🥣",
            btnLabel: "🥄 攪勻粉漿",
            speechPrompt: "跟住木魚拍子，將粘米粉、粟粉 30 克、水同鹽、糖、胡椒粉拌勻成無顆粒粉漿！請按四下。",
            shortActionWords: ["一、攪勻", "二、攪勻", "三、滑溜", "四、無顆粒"],
            completeSpeech: "粉漿拌得好順滑、無顆粒啦！請按「去下一步」爆香配料。"
          });
        }
      }

      function renderStep2SauteToppings() {
        renderRhythmStep({
          badge: "第二步（共五步）",
          title: "爆香配料，盛起備用",
          instruction: "熱鍋加少許油，跟住拍子炒香臘腸、蝦米 4 下，炒香後盛起備用！",
          safety: "🔥 安全提示：熱鍋有油好高溫，要由老師或者家長陪同開火，千祈唔好摸個鑊！",
          emojiBefore: "🦐",
          emojiAfter: "🥘",
          btnLabel: "🍳 炒香臘腸蝦米",
          speechPrompt: "第二步：爆香配料。熱鍋加少許油，炒香臘腸同蝦米，盛起備用。熱鍋好高溫，要由大人協助開火！跟住拍子按四下。",
          shortActionWords: ["一、炒香", "二、炒香", "三、好香呀", "四、盛起備用"],
          completeSpeech: "臘腸同蝦米炒到好香啦，盛起備用！請按「去下一步」煮軟蘿蔔。"
        });
      }

      function renderStep3CookRadish() {
        renderRhythmStep({
          badge: "第三步（共五步）",
          title: "煮軟蘿蔔至自然出水",
          instruction: "原鍋放入白蘿蔔絲，跟住拍子炒軟並煮至自然出水（不用另外加水）！",
          safety: "💧 烹飪重點：白蘿蔔本身好多水份，煮軟就會自然出水，千祈唔使另外加水呀！",
          emojiBefore: "🥕",
          emojiAfter: "🍲",
          btnLabel: "♨️ 炒軟白蘿蔔",
          speechPrompt: "第三步：煮軟蘿蔔。原鍋放入白蘿蔔絲炒軟，煮到自然出水，唔使另外加水㗎！跟住拍子按四下。",
          shortActionWords: ["一、炒軟", "二、煮軟", "三、出水啦", "四、唔使加水"],
          completeSpeech: "白蘿蔔絲煮軟，仲出咗好多清甜蘿蔔水啦！請按「去下一步」拌入粉漿。"
        });
      }

      function renderStep4MixBatterIntoPot() {
        renderRhythmStep({
          badge: "第四步（共五步）",
          title: "降溫拌入粉漿成糊狀",
          instruction: "配料倒回蘿蔔鍋，轉小火（或熄火稍降溫），分次倒入粉漿快速拌成濃稠糊狀！",
          safety: "⚠️ 烹飪重點：一定要先轉小火或熄火稍降溫，再分次倒粉漿快速攪拌，先唔會結塊！",
          emojiBefore: "🥣➕🍲",
          emojiAfter: "🫕",
          btnLabel: "🥄 快速拌成糊狀",
          speechPrompt: "第四步：拌入粉漿。將炒香嘅配料倒回蘿蔔鍋中，轉小火或者熄火稍降溫，分次倒入攪勻嘅粉漿，快速拌成濃稠糊狀！跟住拍子按四下。",
          shortActionWords: ["一、倒粉漿", "二、快手拌", "三、變濃稠", "四、成糊狀"],
          completeSpeech: "好叻呀！已經拌成濃稠嘅蘿蔔糕糊狀啦！請按「去下一步」蒸熟放涼。"
        });
      }

      function renderStep5SteamAndCool() {
        renderRhythmStep({
          badge: "第五步（最後一步）",
          title: "大火蒸熟，放涼冷藏定型",
          instruction: "倒入已抹油的糕盤，水滾後大火蒸 45 至 60 分鐘，完全放涼再冷藏定型！",
          safety: "💨 安全提示：水滾蒸煮有高溫蒸氣，要請老師戴隔熱手套拎出嚟，完全放涼先可以切件！",
          emojiBefore: "🫕",
          emojiAfter: "♨️❄️",
          btnLabel: "⏲️ 大火蒸熟定型",
          speechPrompt: "第五步：蒸熟放涼。倒入已抹油嘅糕盤，水滾後大火蒸 45 至 60 分鐘，蒸熟之後要完全放涼，再放入雪櫃冷藏定型！跟住拍子按四下。",
          shortActionWords: ["一、入糕盤", "二、大火蒸", "三、完全放涼", "四、冷藏定型"],
          completeSpeech: "叮！時間到！蒸熟又完全放涼定型，香噴噴嘅蘿蔔糕大功告成啦！"
        });
      }

      function renderRhythmStep(config) {
        var isDone = gameState.actionCount >= gameState.targetActions;

        stageContainer.innerHTML =
          '<div class="step-badge">' + config.badge + '</div>' +
          '<h1>' + config.title + '</h1>' +
          '<div class="visual-stage" id="visualEmoji">' + (isDone ? config.emojiAfter : config.emojiBefore) + '</div>' +
          '<div class="count-display">已完成：' + gameState.actionCount + ' / ' + gameState.targetActions + ' 下</div>' +
          (!isDone
            ? '<div class="rhythm-meter" aria-hidden="true">' +
                '<div class="beat-circle" id="beat-0">1</div>' +
                '<div class="beat-circle" id="beat-1">2</div>' +
                '<div class="beat-circle" id="beat-2">3</div>' +
                '<div class="beat-circle" id="beat-3">4</div>' +
              '</div>'
            : '') +
          '<p class="instruction-text">' + config.instruction + '</p>' +
          '<div class="safety-box">' + config.safety + '</div>' +
          (!isDone
            ? '<button type="button" class="big-action-btn" id="primaryActionBtn">' + config.btnLabel + '</button>'
            : '<button type="button" class="big-action-btn" id="primaryActionBtn">🎉 完成！去下一步</button>');

        if (gameState.actionCount === 0) {
          voice.speak(config.speechPrompt, true);
        }

        if (!isDone) {
          sound.startRhythmLoop(function(beatIdx) {
            for (var i = 0; i < 4; i++) {
              var el = document.getElementById('beat-' + i);
              if (el) {
                if (i === beatIdx) el.classList.add('pulse');
                else el.classList.remove('pulse');
              }
            }
          });
        }

        focusPrimaryButton();

        var btn = document.getElementById('primaryActionBtn');
        btn.onclick = function() {
          if (!isDone) {
            var currentIdx = gameState.actionCount;
            gameState.actionCount++;
            sound.playActionFeedback(currentIdx);

            var visual = document.getElementById('visualEmoji');
            if (visual) {
              visual.classList.add('bounce');
              setTimeout(function() { visual.classList.remove('bounce'); }, 180);
            }

            if (gameState.actionCount >= gameState.targetActions) {
              sound.stopRhythmLoop();
              sound.playStepSuccess();
              voice.speak(config.completeSpeech, true);
            } else {
              var word = config.shortActionWords[currentIdx] || ('第 ' + gameState.actionCount + ' 下');
              voice.speak(word, false);
            }
            renderRhythmStep(config);
          } else {
            sound.playStepSuccess();
            gameState.step++;
            gameState.actionCount = 0;
            renderStage();
          }
        };
      }

      function renderCompletion() {
        var msg = "恭喜你！你已經學識整正宗蘿蔔糕嘅五個步驟：備料調漿、爆香配料、煮軟蘿蔔、拌入粉漿，仲有蒸熟放涼冷藏定型！我哋一齊聽住音樂慶祝啦！";
        stageContainer.innerHTML =
          '<div class="step-badge">🎊 大功告成 🎊</div>' +
          '<h1>美味蘿蔔糕完成啦！</h1>' +
          '<div class="visual-stage">🥮 🥢 😋 🎶</div>' +
          '<ol class="summary-list">' +
            '<li>備料調漿：蘿蔔切條、臘腸蝦米切粒、粉漿拌勻無顆粒</li>' +
            '<li>爆香配料：熱鍋少油炒香臘腸蝦米，盛起備用</li>' +
            '<li>煮軟蘿蔔：原鍋炒軟白蘿蔔絲至自然出水（不加水）</li>' +
            '<li>拌入粉漿：配料回鍋降溫，分次倒粉漿快速拌成糊狀</li>' +
            '<li>蒸熟放涼：入抹油糕盤大火蒸 45–60 分鐘，放涼冷藏定型</li>' +
          '</ol>' +
          '<button type="button" class="big-action-btn" id="primaryActionBtn">🔄 再玩一次</button>';
        sound.playCelebrationSong();
        voice.speak(msg, true);
        focusPrimaryButton();

        document.getElementById('primaryActionBtn').onclick = function() {
          gameState.step = 0;
          gameState.subPhase = 'select';
          gameState.actionCount = 0;
          gameState.selected = [];
          renderStage();
        };
      }

      document.getElementById('btnRepeatSpeech').onclick = function() {
        voice.repeat();
      };

      document.getElementById('btnToggleBeat').onclick = function() {
        sound.beatEnabled = !sound.beatEnabled;
        this.textContent = sound.beatEnabled ? "🎵 節拍器：開" : "🔇 節拍器：關";
        voice.speak(sound.beatEnabled ? "已開啟節拍器" : "已關閉節拍器", false);
      };

      document.getElementById('btnToggleTheme').onclick = function() {
        document.body.classList.toggle('soft-theme');
        var isSoft = document.body.classList.contains('soft-theme');
        this.textContent = isSoft ? "👁️ 柔和模式" : "👁️ 高對比模式";
        voice.speak(isSoft ? "切換至暖色柔和模式" : "切換至黑底黃字高對比模式", false);
      };

      document.getElementById('btnReset').onclick = function() {
        sound.stopRhythmLoop();
        gameState.step = 0;
        gameState.subPhase = 'select';
        gameState.actionCount = 0;
        gameState.selected = [];
        renderStage();
      };

      document.addEventListener('keydown', function(e) {
        if (e.code === 'Space' || e.keyCode === 32) {
          if (document.activeElement && document.activeElement.classList.contains('tool-btn')) {
            return;
          }
          e.preventDefault();

          if (gameState.step === 1 && gameState.subPhase === 'select' && gameState.selected.length < ingredientsList.length) {
            for (var i = 0; i < ingredientsList.length; i++) {
              var id = ingredientsList[i].id;
              if (gameState.selected.indexOf(id) === -1) {
                var targetBtn = document.querySelector('.ingredient-btn[data-id="' + id + '"]');
                if (targetBtn) targetBtn.click();
                break;
              }
            }
            return;
          }

          var primaryBtn = document.getElementById('primaryActionBtn');
          if (primaryBtn) {
            primaryBtn.classList.add('pressed');
            setTimeout(function() { primaryBtn.classList.remove('pressed'); }, 150);
            primaryBtn.click();
          }
        }
      });
    })();
  </script>
</body>
</html>
